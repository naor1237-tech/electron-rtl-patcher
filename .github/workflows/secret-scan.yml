# סריקת סודות (מפתחות API, טוקנים, סיסמאות) עם gitleaks (github.com/gitleaks/gitleaks).
# ב-PR: נכשל אם אחד הקומיטים החדשים מכיל סוד, לפני שהוא נכנס ל-main.
# פעם בשבוע ובהרצה ידנית: סורק את כל ההיסטוריה ומציג דוח בסיכום ההרצה, בלי להיכשל,
# כי סוד שכבר בהיסטוריה צריך להחליף (rotate), לא לחסום בגללו עבודה.
# הבינארי הרשמי מה-releases של gitleaks: בלי רישיון ובלי action על Node.
name: Secret scan

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the new commits in this PR
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --log-opts="$RANGE"

      - name: Scan the full history (report only)
        if: github.event_name != 'pull_request'
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 0 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"
          # shellcheck disable=SC2016 # the JS below uses its own ${...}, not the shell's
          node -e '
            const r = require(process.argv[1]);
            const out = ["## gitleaks: " + r.length + " findings in the full history"];
            if (r.length) out.push("", "| file | rule | commit | date |", "|---|---|---|---|");
            for (const f of r.slice(0, 100)) out.push(`| ${f.File}:${f.StartLine} | ${f.RuleID} | ${f.Commit.slice(0, 7)} | ${f.Date.slice(0, 10)} |`);
            if (r.length) out.push("", "A secret in the history is already exposed to anyone who can read the repo: rotate it, then add its Fingerprint to .gitleaksignore.");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          ' "$RUNNER_TEMP/gitleaks.json"
